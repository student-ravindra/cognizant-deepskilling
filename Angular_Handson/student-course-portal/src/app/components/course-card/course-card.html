<div
  class="card"
  appHighlight="lightblue"
  [ngClass]="cardClasses"
  [ngStyle]="{ 'border-left': '6px solid ' + getBorderColor() }">

  <h3>{{ course.name }}</h3>

  <p>ID: {{ course.id }}</p>
  <p>Code: {{ course.code }}</p>
  <p>Credits: {{ course.credits | creditLabel }}</p>

  <div [ngSwitch]="course.gradeStatus">

    <span *ngSwitchCase="'passed'" class="passed">
      Passed
    </span>

    <span *ngSwitchCase="'failed'" class="failed">
      Failed
    </span>

    <span *ngSwitchDefault class="pending">
      Pending
    </span>

  </div>

  <button (click)="toggleDetails()">
    Show Details
  </button>

  <button (click)="enrollRequested.emit(course.id)">
    Enroll
  </button>

</div>
