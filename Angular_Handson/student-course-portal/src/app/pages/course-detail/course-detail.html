<div *ngIf="course">

  <h2>{{ course.name }}</h2>

  <p>
    <strong>Course Code:</strong>
    {{ course.code }}
  </p>

  <p>
    <strong>Credits:</strong>
    {{ course.credits }}
  </p>

  <p>
    <strong>Status:</strong>
    {{ course.gradeStatus }}
  </p>

  <p>
    <strong>Enrollment:</strong>
    {{ course.enrolled ? 'Enrolled' : 'Not Enrolled' }}
  </p>

</div>
