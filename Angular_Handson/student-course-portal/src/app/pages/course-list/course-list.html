<h2>Course List</h2>

<input
  type="text"
  [(ngModel)]="searchTerm"
  (input)="updateSearch()"
  placeholder="Search courses">


<ng-container *ngIf="courses$ | async as courses">

  <ng-container *ngIf="courses.length > 0; else noCourses">

    <app-course-card
      *ngFor="let c of courses; let i = index; trackBy: trackByCourseId"
      [course]="c"
      (enrollRequested)="onEnroll($event)"
      (click)="viewCourse(c.id)">
    </app-course-card>

  </ng-container>

</ng-container>


<ng-template #noCourses>
  <p>No courses available.</p>
</ng-template>


<p *ngIf="selectedCourseId">
  Selected course ID: {{ selectedCourseId }}
</p>
