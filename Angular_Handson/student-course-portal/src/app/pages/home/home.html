<h1>{{ portalName }}</h1>


<button 
[disabled]="!isPortalActive"
(click)="onEnrollClick()">

Enroll Now

</button>


<p>{{message}}</p>


<br>


<input 
type="text"
placeholder="Search courses"
[(ngModel)]="searchTerm">


<p>
Searching for: {{searchTerm}}
</p>
<h2>Home Page</h2>

<p>Available Courses: {{ availableCourses }}</p>


<!-- 
[property] means one-way binding:
Component data flows to DOM.

[(ngModel)] means two-way binding:
Data flows from component to DOM
and DOM changes update component.
-->
