<h2>Student Enrollment Request Form</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <label>Student Name:</label>
  <input
    type="text"
    name="studentName"
    [(ngModel)]="studentName"
    #nameCtrl="ngModel"
    required
    minlength="3">

  <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
    Name is required
  </span>

  <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
    Name must be at least 3 characters
  </span>

  <br>

  <label>Student Email:</label>
  <input
    type="email"
    name="studentEmail"
    [(ngModel)]="studentEmail"
    #emailCtrl="ngModel"
    required
    email>

  <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">
    Email is required
  </span>

  <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">
    Enter a valid email
  </span>

  <br>

  <label>Course ID:</label>
  <input
    type="number"
    name="courseId"
    [(ngModel)]="courseId"
    #courseCtrl="ngModel"
    required>

  <span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
    Course ID is required
  </span>

  <br>

  <label>Preferred Semester:</label>

  <select
    name="preferredSemester"
    [(ngModel)]="preferredSemester">

    <option value="Odd">Odd</option>
    <option value="Even">Even</option>

  </select>

  <br>

  <label>
    <input
      type="checkbox"
      name="agreeToTerms"
      [(ngModel)]="agreeToTerms"
      #termsCtrl="ngModel"
      required>

    Agree to Terms
  </label>

  <span *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">
    You must accept terms
  </span>

  <br>

  <button type="submit" [disabled]="enrollForm.invalid">
    Submit
  </button>

  <button type="button" (click)="enrollForm.resetForm()">
    Reset
  </button>

</form>


<div *ngIf="submitted">
  Enrollment request submitted successfully!
</div>
